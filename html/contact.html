<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title i18n data-ca="Blog - SK8 | Contacte" data-es="Blog - SK8 | Contacto" data-en="Blog - SK8 | Contact">Blog - SK8 | Contacte</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
    
    <script src="../js/script.js"></script>
</head>
<body class="body">
    <header class="header">
        <img src="./../img/BannerSK8.png" alt="logo" class="logo">
        
        <div class="lang-container" style="margin-left: auto; margin-right: 15px;">
            <select id="langSelect">
              <option value="ca">Català</option>
              <option value="es">Castellano</option>
              <option value="en">English</option>
            </select>
        </div>

        <div class="loginDiv"><a href="../html/login.html" i18n data-ca="Iniciar Sessió" data-es="Iniciar Sesión" data-en="Login">Iniciar Sessió</a></div>
    </header>

    <nav class="nav">
        <a href="../index.html" i18n data-ca="Inici" data-es="Inicio" data-en="Home">Inici</a>
        <a href="../html/about.html" i18n data-ca="Sobre nosaltres" data-es="Sobre nosotros" data-en="About us">Sobre nosaltres</a>
        <a href="../html/posts.html" i18n data-ca="Trucs de skate" data-es="Trucos de skate" data-en="Skate tricks">Trucs de skate</a>
        <a href="../html/store.html" i18n data-ca="La nostra botiga" data-es="Nuestra tienda" data-en="Our store">La nostra botiga</a>
        <a href="../html/contact.html" i18n data-ca="Contacta'ns" data-es="Contáctanos" data-en="Contact us">Contacta'ns</a>
    </nav>

    <main class="main">
        <div class="contenidor">
            <div class="caixa-formulari">
                <h2 i18n data-ca="Contacte" data-es="Contacto" data-en="Contact">Contacte</h2>
                
                <form action="#" method="POST">
                    <div class="grup-input">
                        <label for="name" i18n data-ca="Nom:" data-es="Nombre:" data-en="Name:">Nom:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="grup-input">
                        <label for="email" i18n data-ca="Correu electrònic:" data-es="Correo electrónico:" data-en="Email:">Correu electrònic:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="grup-input">
                        <label for="message" i18n data-ca="Missatge:" data-es="Mensaje:" data-en="Message:">Missatge:</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="boto" i18n data-ca="Enviar Missatge" data-es="Enviar Mensaje" data-en="Send Message">Enviar Missatge</button>
                </form>
                
                <div class="text-canvi">
                    <p><a href="/" i18n data-ca="Tornar a l'inici" data-es="Volver al inicio" data-en="Return to home">Tornar a l'inici</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <marquee behavior="scroll" direction="left">
        <div class="marqueeDiv">
            <img src="../img/sk8icon.png" alt="icon">
            <p i18n data-ca="Sk8. De sk8ers, per sk8ers. ©2026 Pau & Marc productions" data-es="Sk8. De sk8ers, para sk8ers. ©2026 Pau & Marc productions" data-en="Sk8. By sk8ers, for sk8ers. ©2026 Pau & Marc productions">Sk8. De sk8ers, per sk8ers. ©2026 Pau & Marc productions</p>
        </div>
        </marquee>
    </footer>
</body>
</html>
