<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - SK8 | Contacte</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        
        body {
            background-color: #FAFBF8; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        
        .contenidor {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }

        
        .caixa-formulari {
            background-color: #414142; 
            padding: 50px 40px; 
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); 
            width: 100%;
            max-width: 600px; /* Hem ampliat la caixa a 600px perquè sigui ben ampla */
        }

        
        h2 {
            text-align: center;
            margin-bottom: 30px; 
            color: #FAFBF8; 
            font-size: 28px; 
        }

        .grup-input {
            margin-bottom: 20px; 
        }

        .grup-input label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #FAFBF8; 
            font-weight: 600;
        }

        
        .grup-input input,
        .grup-input textarea {
            width: 100%;
            padding: 14px; 
            border: 2px solid #5a5a5b; 
            border-radius: 5px;
            font-size: 16px;
            background-color: #FAFBF8; 
            color: #414142; 
            transition: border-color 0.3s;
            resize: vertical; 
        }

        
        .grup-input input:focus,
        .grup-input textarea:focus {
            border-color: #EDD5A6; 
            outline: none;
        }

        
        .boto {
            width: 100%;
            padding: 14px; 
            background-color: #EDD5A6; 
            color: #414142; 
            border: none;
            border-radius: 5px;
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 15px;
        }

        
        .boto:hover {
            background-color: #dcb97d; 
        }

       
        .text-canvi {
            text-align: center;
            margin-top: 20px;
            font-size: 15px;
            color: #FAFBF8; 
        }

        
        .text-canvi a {
            color: #FAFBF8;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #EDD5A6; 
            transition: color 0.3s, border-bottom-color 0.3s;
        }

        .text-canvi a:hover {
            color: #EDD5A6; 
            border-bottom-color: #FAFBF8;
        }
    </style>
</head>
<body>
    <div class="contenidor">
        <div class="caixa-formulari">
            <h2>Contacte</h2>
            
            <form action="#" method="POST">
                <div class="grup-input">
                    <label for="name">Nom:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="grup-input">
                    <label for="email">Correu electrònic:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="grup-input">
                    <label for="message">Missatge:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>

                <button type="submit" class="boto">Enviar Missatge</button>
            </form>
            
            <div class="text-canvi">
                <p><a href="/">Tornar a l'inici</a></p>
            </div>
        </div>
    </div>
</body>
</html>
