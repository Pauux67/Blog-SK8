<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sessió</title>
    <link rel="icon" type="image/x-icon" href="./img/logoSK8nopaper.png">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="body">
    <div class="contenidor">
        <div class="caixa-formulari">
            <h2>Iniciar Sessió</h2>
            <form action="#">
                <div class="grup-input">
                    <label for="login-email">Correu electrònic</label>
                    <input type="email" id="login-email" placeholder="El teu correu" required>
                </div>
                <div class="grup-input">
                    <label for="login-password">Contrasenya</label>
                    <input type="password" id="login-password" placeholder="La teva contrasenya" required>
                </div>
                <button type="submit" class="boto">Entrar</button>
                <p class="text-canvi">No tens compte? <a href="register.html">Registra't</a></p>
            </form>
        </div>
    </div>
    
    <footer class="footer">
        <a href="./../index.html"><h2>Tornar a l'inici</h2></a>
        <marquee behavior="scroll" direction="left">
            <div class="marqueeDiv">
            <img src="./../img/sk8icon.png" alt="icon"> 
            <p>Sk8. De sk8ers, per sk8ers. ©2026 Pau & Marc productions</p>
            </div>
        </marquee>
    </footer>
</body>
</html>
