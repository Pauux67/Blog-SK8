<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear un Compte</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="contenidor">
        <div class="caixa-formulari">
            <h2>Crear un Compte</h2>
            <form action="#">
                <div class="grup-input">
                    <label for="reg-nom">Nom complet</label>
                    <input type="text" id="reg-nom" placeholder="El teu nom" required>
                </div>
                <div class="grup-input">
                    <label for="reg-email">Correu electrònic</label>
                    <input type="email" id="reg-email" placeholder="El teu correu" required>
                </div>
                <div class="grup-input">
                    <label for="reg-password">Contrasenya</label>
                    <input type="password" id="reg-password" placeholder="Crea una contrasenya" required>
                </div>
                <button type="submit" class="boto">Registrar-se</button>
                <p class="text-canvi">Ja tens compte? <a href="login.html">Inicia sessió</a></p>
            </form>
        </div>
    </div>

</body>
</html>
